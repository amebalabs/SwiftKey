			shellPath = /bin/bash;
			shellScript = "# Builds the swiftkey-micro console tool from Packages/SwiftKeyCore and puts it next to the app's\n# executable, signed like the app. swift build is incremental, so an unchanged tool costs little;\n# the copy and the signature happen only when the tool changed.\nset -euo pipefail\nPACKAGE=\"$SRCROOT/Packages/SwiftKeyCore\"\nSCRATCH=\"$OBJROOT/swiftkey-micro\"\nDEST=\"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/swiftkey-micro\"\nif [ \"$CONFIGURATION\" = \"Release\" ]; then\n  ARGS=(-c release --arch arm64 --arch x86_64)\nelse\n  ARGS=(-c debug)\nfi\n# Xcode's build variables point SwiftPM at the wrong SDK and toolchain settings; build in a clean environment.\nbuild() {\n  env -i PATH=\"/usr/bin:/bin:/usr/sbin:/sbin\" HOME=\"$HOME\" DEVELOPER_DIR=\"$DEVELOPER_DIR\" TMPDIR=\"${TMPDIR:-/tmp}\" \\\n    xcrun swift build --package-path \"$PACKAGE\" --scratch-path \"$SCRATCH\" \"${ARGS[@]}\" --product swiftkey-micro \"$@\"\n}\nbuild\nBIN=\"$(build --show-bin-path)/swiftkey-micro\"\nmkdir -p \"$(dirname \"$DEST\")\"\nif [ -f \"$DEST\" ] && [ \"$DEST\" -nt \"$BIN\" ]; then\n  exit 0\nfi\ncp -f \"$BIN\" \"$DEST\"\nIDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:-}\"\nif [ -n \"$IDENTITY\" ]; then\n  TIMESTAMP=\"--timestamp=none\"\n  if [ \"$CONFIGURATION\" = \"Release\" ] && [ \"$IDENTITY\" != \"-\" ]; then TIMESTAMP=\"--timestamp\"; fi\n  codesign --force --options runtime \"$TIMESTAMP\" --identifier \"$PRODUCT_BUNDLE_IDENTIFIER.swiftkey-micro\" --sign \"$IDENTITY\" \"$DEST\"\nfi\n";
		};
