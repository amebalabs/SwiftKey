[tools]
[tasks.build]
description = "Build tasks"
run = "xcodebuild -scheme 'SwiftKey' -configuration Release build"

[tasks.test-core]
description = "Test tasks"
run = "swift test --package-path Packages/SwiftKeyCore"

[tasks.test]
description = "Test tasks"
run = "swift test --package-path Packages/SwiftKeyCore && xcodebuild -scheme 'SwiftKey' -configuration Debug -destination 'platform=macOS' -test-timeouts-enabled YES -default-test-execution-time-allowance 60 test"

[tasks.test-ui]
description = "Test tasks (presses keys and takes focus: run only when nobody is typing)"
run = "xcodebuild -scheme 'SwiftKeyUITests' -configuration Debug -destination 'platform=macOS' -test-timeouts-enabled YES -default-test-execution-time-allowance 120 test"

[tasks.format]
description = "Code quality"
run = "swiftformat ."

[tasks.pre-commit]
description = "Code quality"
run = "./swiftformat.sh"

[tasks.cleanbuild]
description = "Development helpers"
run = "xcodebuild -scheme 'SwiftKey' clean"

[tasks.reset-derived]
description = "Development helpers"
run = "rm -rf ~/Library/Developer/Xcode/DerivedData/*"

[tasks.reset-xcode]
description = "Development helpers"
run = "killall Xcode || true && open -a Xcode"

[tasks.cleanup]
description = "Clean up"
run = "rm -rf ~/Library/Caches/com.amebalabs.SwiftKey/* ~/Library/Containers/com.ameba.SwiftKey/Data/Documents/* && defaults remove com.ameba.SwiftKey"
